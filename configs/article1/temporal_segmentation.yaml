article1:
  classes: configs/article1/classes_article1.yaml
  mapillary_mapping: configs/article1/mapillary_to_article1.yaml
  output_subdir: article1_external
  unknown:
    enabled: true
    min_top1_probability: 0.45
    min_top1_top2_margin: 0.08
    max_normalized_entropy: 0.75
    unsupported_native_to_unknown: true
    combine_rule: any
  thin_markings:
    lane_threshold: 0.40
    regulatory_threshold: 0.45
    candidate_probability_floor: 0.10
    road_probability_threshold: 0.25
    use_road_probability_support: true
    use_base_mask_support: true
    road_support_dilation_px: 12
    nonroad_conflict_threshold: 0.55
    min_road_overlap: 0.60
    accepted_component_policy: supported_pixels_only
    min_component_area_px: 25
    max_component_area_frac: 0.08
    min_top1_top2_margin: 0.05
    suppress_on_nonroad_classes: true
    morphology_open_kernel: 1
    morphology_close_kernel: 1
  probability_dtype: float16

temporal:
  causal: true
  gaze_assisted: false
  processing_scale: 0.5
  mode: T4
  output_subdir: article1_temporal
  diagnostic_outputs: true
  probability_checkpoint_frames: [first, middle, last, reset, large_difference]
  state_checkpoint_interval: 50
  optical_flow:
    backend: opencv_dis
    processing_scale: 1.0
    grayscale: true
    use_forward_backward_check: true
    forward_backward_threshold_px: 1.5
    photometric_error_threshold: 0.15
    max_median_flow_px: 80
    min_valid_fraction: 0.40
  reset:
    max_frame_gap_s: 0.25
    max_invalid_flow_fraction: 0.60
    max_photometric_error: 0.15
    max_median_flow_px: 80
    reset_on_resolution_change: true
    reset_on_non_monotonic_timestamp: true
  fusion:
    current_weight: 1.0
    previous_weight: 0.65
    minimum_previous_confidence: 0.55
    uncertain_current_threshold: 0.55
    uncertain_current_margin: 0.08
    temporal_decay: 0.85
    probability_epsilon: 1.0e-8
    normalize_after_fusion: true
  hysteresis:
    enabled: true
    switch_margin: 0.10
    minimum_confirmation_frames: 2
    immediate_switch_confidence: 0.80
    previous_drop_threshold: 0.25
  classes:
    unknown: {ttl_frames: 0, previous_weight: 0.0}
    road_surface: {ttl_frames: 3, previous_weight: 0.55, allow_unknown_recovery: true}
    lane_marking: {ttl_frames: 3, previous_weight: 0.75, allow_unknown_recovery: true}
    regulatory_road_marking: {ttl_frames: 2, previous_weight: 0.65, allow_unknown_recovery: true}
    vehicle: {ttl_frames: 1, previous_weight: 0.35, require_current_support: true}
    two_wheeler: {ttl_frames: 1, previous_weight: 0.25, require_current_support: true}
    pedestrian: {ttl_frames: 1, previous_weight: 0.20, require_current_support: true}
    traffic_light: {ttl_frames: 2, previous_weight: 0.45}
    traffic_sign: {ttl_frames: 2, previous_weight: 0.45}
    road_boundary_or_obstacle: {ttl_frames: 2, previous_weight: 0.45}
    mirror: {ttl_frames: 1, previous_weight: 0.15}
    instrument_display: {ttl_frames: 1, previous_weight: 0.15}
    control_and_ego_vehicle: {ttl_frames: 1, previous_weight: 0.15}
    other_environment: {ttl_frames: 1, previous_weight: 0.15}
  thin_markings:
    enabled: true
    lane_ttl_frames: 3
    regulatory_ttl_frames: 2
    minimum_previous_confidence: 0.55
    require_current_road_support: true
    suppress_on_current_nonroad: true
    max_propagation_distance_px: 40
    temporal_decay: 0.75
