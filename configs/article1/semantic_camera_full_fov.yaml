# Article 1 semantic camera, full field of view with shared mirror and cockpit
# refinement.
#
# Differences from configs/article1/semantic_camera.yaml, and why:
#
# 1. Shared prompts. The frozen prompt set describes a car, so a motorcycle's
#    bar-end mirror has no phrasing that can match it. The shared set names both
#    vehicles and lets the detector decide; there is no domain switch.
#
# 2. A far weaker geometric cockpit prior. The frozen prior paints the bottom 32%
#    of the frame as control_and_ego_vehicle at confidence 0.40 wherever the
#    detector found nothing. That is a fair description of a dashboard and a poor
#    one of open road under a handlebar. Here it covers the bottom 14% at
#    confidence 0.15 and may only displace `unknown`, so it can never take road
#    surface, a vehicle or any other real external class.
#
# This configuration is meant to run unchanged on the car as well.

project:
  grounded_prompts: configs/article1/grounded_prompts_shared_cockpit.yaml

semantic_camera:
  version: 1
  classes: configs/article1/classes_article1.yaml
  output_subdir: semantic_camera

  external:
    use_probabilities_if_available: false

  internal:
    mode: auto
    segformer_checkpoint: weights/segformer-b2-article1-cockpit
    device: cuda
    fallback: grounded_sam2_proxy
    geometric_proxy:
      enabled: true
      # was 0.68: the bottom third of a motorcycle frame is mostly road
      bottom_start_fraction: 0.86
      # was 0.40: a positional guess must not look like an observation
      confidence: 0.15

  fusion:
    entropy_penalty: 0.20
    conflict_margin: 0.03
    geometric_score_relaxation: 0.20
    geometric_external_max_confidence: 0.68
    dense_fill_confidence: 0.0
    # was [unknown, vehicle, road_boundary_or_obstacle, other_environment]:
    # a geometric guess may only fill a decision that is absent, never displace
    # a real external class
    geometric_override_classes: [unknown]
    internal_min_confidence:
      mirror: 0.25
      instrument_display: 0.25
      control_and_ego_vehicle: 0.28
    external_priorities:
      unknown: 0
      road_surface: 90
      lane_marking: 125
      regulatory_road_marking: 120
      vehicle: 95
      two_wheeler: 115
      pedestrian: 125
      traffic_light: 135
      traffic_sign: 130
      road_boundary_or_obstacle: 75
      mirror: 0
      instrument_display: 0
      control_and_ego_vehicle: 0
      other_environment: 25
    internal_priorities:
      mirror: 150
      instrument_display: 140
      control_and_ego_vehicle: 110

  render:
    overlay_alpha: 0.45
    fps: 15

# Mirror candidate gating. Size, shape and confidence only: a mirror touching the
# image border is explicitly kept, because on a motorcycle that is the normal case
# and losing a real mirror is the failure this refinement exists to fix.
mirror_refinement:
  enabled: true
  min_area_fraction: 0.00004
  max_area_fraction: 0.030
  max_aspect_ratio: 5.0
  min_fill_ratio: 0.18
  min_score: 0.20
  allow_edge_contact: true
  temporal_window_frames: 5
  temporal_minimum_support: 2
  # a mirror mask may bridge a short dropout but must disappear with the mirror
  max_persistence_frames: 3

grounded_sam2:
  class_whitelist:
    - steering_wheel
    - instrument_cluster
    - dashboard
    - infotainment_screen
    - rear_view_mirror
    - side_mirror
    - left_side_mirror
    - right_side_mirror
    - windshield
    - a_pillar
    - driver_hand
    - smartphone
    - other_cockpit
  prompt_mode_override: combined
  hierarchical_subclasses: false
  roi_enabled: false
  multiscale_enabled: false
  gaze_conditioned: false
