# Mapillary Vistas v1.2 (65 eval classes) -> canonical taxonomy (§6.3).
# Keyed by the EXACT native label string (as in the model's id2label). Method 2 keeps
# the native id-mask AND this canonical view; it never deletes native labels.
#
# support:
#   supported            direct canonical equivalent -> counts in method-vs-method eval
#   partially_supported  approximate mapping (coarser/related) -> excluded from strict eval
#   unsupported          no canonical equivalent -> mapped to `unknown`
#
# NB: Mapillary distinguishes "Ego Vehicle" / "Car Mount" from "Car", so Method 2 labels
# the ego cabin correctly (it does NOT call the driver's own car "car").

version: 1
dataset: "Mapillary Vistas v1.2 (65 classes)"

mapping:
  "Bird":                    { canonical: unknown,       support: unsupported }
  "Ground Animal":           { canonical: unknown,       support: unsupported }
  "Curb":                    { canonical: curb,          support: supported }
