# Canonical taxonomy for aria_drive_seg — single source of truth.
# Every method maps ITS native labels onto these canonical ids. The palette is
# deterministic and shared across both methods so colored overlays are comparable.
#
# groups:
#   special  -> unknown / unassigned pixels (id 0). Never invented from a residual mask.
#   road     -> outdoor road-scene classes (§6.1). Supported by BOTH methods (where the
#               Mapillary taxonomy has an equivalent).
#   cockpit  -> vehicle-interior classes (§6.2). Typically only Grounded-SAM2 (open-vocab).
#               OneFormer is NOT forced to produce these.
#
# fields per class:
#   id        canonical integer id written into the uint16 mask
#   group     special | road | cockpit
#   color     [r,g,b] deterministic palette (0-255)
#   eval      whether the class is part of the "common" set used for direct method-vs-method
#             comparison. Only classes supported by both methods should be true.

version: 1

classes:
  # ---- special -----------------------------------------------------------
  - { id: 0,  name: unknown,            group: special, color: [0, 0, 0],       eval: false }

  # ---- common road-scene classes (§6.1) ----------------------------------
  - { id: 1,  name: road_surface,       group: road,    color: [128, 64, 128],  eval: true }
  - { id: 2,  name: lane_marking,       group: road,    color: [255, 255, 255], eval: true }
  - { id: 3,  name: crosswalk,          group: road,    color: [200, 128, 220], eval: true }
  - { id: 4,  name: sidewalk,           group: road,    color: [244, 35, 232],  eval: true }
  - { id: 5,  name: curb,               group: road,    color: [196, 196, 128], eval: true }
  - { id: 6,  name: parking_area,       group: road,    color: [250, 170, 160], eval: true }
  - { id: 7,  name: person,             group: road,    color: [220, 20, 60],   eval: true }
  - { id: 8,  name: rider,              group: road,    color: [255, 0, 0],     eval: true }
  - { id: 9,  name: car,                group: road,    color: [0, 0, 142],     eval: true }
  - { id: 10, name: truck,              group: road,    color: [0, 0, 70],      eval: true }
  - { id: 11, name: bus,                group: road,    color: [0, 60, 100],    eval: true }
  - { id: 12, name: motorcycle,         group: road,    color: [0, 0, 230],     eval: true }
  - { id: 13, name: bicycle,            group: road,    color: [119, 11, 32],   eval: true }
  - { id: 14, name: traffic_light,      group: road,    color: [250, 170, 30],  eval: true }
  - { id: 15, name: traffic_sign,       group: road,    color: [220, 220, 0],   eval: true }
  - { id: 16, name: pole,               group: road,    color: [153, 153, 153], eval: true }
  - { id: 17, name: guardrail,          group: road,    color: [180, 165, 180], eval: true }
  - { id: 18, name: barrier,            group: road,    color: [250, 170, 100], eval: true }
  - { id: 19, name: wall,               group: road,    color: [102, 102, 156], eval: true }
  - { id: 20, name: fence,              group: road,    color: [190, 153, 153], eval: true }
  - { id: 21, name: building,           group: road,    color: [70, 70, 70],    eval: true }
  - { id: 22, name: vegetation,         group: road,    color: [107, 142, 35],  eval: true }
  - { id: 23, name: terrain,            group: road,    color: [152, 251, 152], eval: true }
  - { id: 24, name: sky,                group: road,    color: [70, 130, 180],  eval: true }
  - { id: 25, name: bridge,             group: road,    color: [150, 100, 100], eval: true }
  - { id: 26, name: tunnel,             group: road,    color: [150, 120, 90],  eval: true }
  - { id: 27, name: rail_track,         group: road,    color: [230, 150, 140], eval: true }

  # ---- cockpit classes (§6.2) --------------------------------------------
  # eval=false: OneFormer(Mapillary) has no equivalent, so they are excluded from the
  # direct method-vs-method comparison (studied only inside Grounded-SAM2).
  - { id: 28, name: steering_wheel,     group: cockpit, color: [255, 140, 0],   eval: false }
  - { id: 29, name: instrument_cluster, group: cockpit, color: [255, 215, 0],   eval: false }
  - { id: 30, name: dashboard,          group: cockpit, color: [139, 69, 19],   eval: false }
  - { id: 31, name: infotainment_screen,group: cockpit, color: [0, 255, 255],   eval: false }
  - { id: 32, name: rear_view_mirror,   group: cockpit, color: [255, 0, 255],   eval: false }
  - { id: 33, name: side_mirror,        group: cockpit, color: [218, 112, 214], eval: false }
  - { id: 34, name: windshield,         group: cockpit, color: [173, 216, 230], eval: false }
  - { id: 35, name: a_pillar,           group: cockpit, color: [160, 82, 45],   eval: false }
  - { id: 36, name: driver_hand,        group: cockpit, color: [255, 205, 148], eval: false }
  - { id: 37, name: smartphone,         group: cockpit, color: [50, 205, 50],   eval: false }
  - { id: 38, name: other_cockpit,      group: cockpit, color: [128, 128, 128], eval: false }
  - { id: 39, name: unknown_cockpit,    group: cockpit, color: [64, 64, 64],    eval: false }

  # ==================================================================
  # Extended taxonomy (Phase 2). IDs 40+ are NEW — existing ids 0-39 keep their
  # meaning (backward compatible). `parent` links a fine subclass to the generic
  # class used for the method-vs-method comparison; `eval: false` because these
  # fine classes have no Mapillary equivalent (Grounded-SAM2 only). Colours are
  # auto-generated deterministically from the id (no explicit `color`).
  # ---- exterior: surfaces & road geometry (subclasses of road markings/surface)
  - { id: 40, name: road_edge,          group: road, eval: false, parent: road_surface }
  - { id: 41, name: lane_divider,       group: road, eval: false, parent: lane_marking }
  - { id: 42, name: stop_line,          group: road, eval: false, parent: lane_marking }
  - { id: 43, name: yield_marking,      group: road, eval: false, parent: lane_marking }
  - { id: 44, name: direction_arrow,    group: road, eval: false, parent: lane_marking }
  - { id: 45, name: speed_bump,         group: road, eval: false, parent: road_surface }
  - { id: 46, name: road_shoulder,      group: road, eval: false, parent: road_surface }
  - { id: 47, name: traffic_island,     group: road, eval: false, parent: sidewalk }
  - { id: 48, name: median,             group: road, eval: false, parent: barrier }
  - { id: 49, name: intersection_area,  group: road, eval: false, parent: road_surface }
  - { id: 50, name: driveway,           group: road, eval: false, parent: road_surface }
  - { id: 51, name: pothole,            group: road, eval: false, parent: road_surface }
  - { id: 52, name: manhole,            group: road, eval: false, parent: road_surface }
  # ---- exterior: road users (subclasses of person/rider)
  - { id: 53, name: pedestrian,         group: road, eval: false, parent: person }
  - { id: 54, name: child,              group: road, eval: false, parent: person }
  - { id: 55, name: cyclist,            group: road, eval: false, parent: rider }
  - { id: 56, name: motorcyclist,       group: road, eval: false, parent: rider }
  - { id: 57, name: scooter_rider,      group: road, eval: false, parent: rider }
  - { id: 58, name: wheelchair_user,    group: road, eval: false, parent: person }
  - { id: 59, name: person_with_stroller, group: road, eval: false, parent: person }
  - { id: 60, name: animal_on_road,     group: road, eval: false }
  # ---- exterior: vehicles (subclasses of car/truck/bus)
  - { id: 61, name: van,                group: road, eval: false, parent: car }
  - { id: 62, name: pickup,             group: road, eval: false, parent: car }
  - { id: 63, name: emergency_vehicle,  group: road, eval: false, parent: car }
  - { id: 64, name: construction_vehicle, group: road, eval: false, parent: truck }
  - { id: 65, name: trailer,            group: road, eval: false, parent: truck }
  - { id: 66, name: tram,               group: road, eval: false }
  - { id: 67, name: train,              group: road, eval: false }
  # ---- exterior: signage & infrastructure (subclasses of traffic_sign/pole)
  - { id: 68, name: stop_sign,          group: road, eval: false, parent: traffic_sign }
  - { id: 69, name: yield_sign,         group: road, eval: false, parent: traffic_sign }
  - { id: 70, name: speed_limit_sign,   group: road, eval: false, parent: traffic_sign }
  - { id: 71, name: warning_sign,       group: road, eval: false, parent: traffic_sign }
  - { id: 72, name: direction_sign,     group: road, eval: false, parent: traffic_sign }
  - { id: 73, name: railway_crossing,   group: road, eval: false, parent: traffic_sign }
  - { id: 74, name: bollard,            group: road, eval: false, parent: pole }
  - { id: 75, name: traffic_cone,       group: road, eval: false }
  - { id: 76, name: delineator_post,    group: road, eval: false, parent: pole }
  - { id: 77, name: street_light,       group: road, eval: false, parent: pole }
  - { id: 78, name: bus_stop,           group: road, eval: false }
  - { id: 79, name: temporary_barrier,  group: road, eval: false, parent: barrier }
  # ---- interior: instruments & controls (subclasses of cockpit generics)
  - { id: 80, name: speedometer_display, group: cockpit, eval: false, parent: instrument_cluster }
  - { id: 81, name: warning_indicator,  group: cockpit, eval: false, parent: instrument_cluster }
  - { id: 82, name: navigation_display, group: cockpit, eval: false, parent: infotainment_screen }
  - { id: 83, name: center_console,     group: cockpit, eval: false, parent: dashboard }
  - { id: 84, name: climate_controls,   group: cockpit, eval: false, parent: other_cockpit }
  - { id: 85, name: gear_selector,      group: cockpit, eval: false, parent: other_cockpit }
  - { id: 86, name: left_air_vent,      group: cockpit, eval: false, parent: other_cockpit }
  - { id: 87, name: right_air_vent,     group: cockpit, eval: false, parent: other_cockpit }
  - { id: 88, name: left_side_mirror,   group: cockpit, eval: false, parent: side_mirror }
  - { id: 89, name: right_side_mirror,  group: cockpit, eval: false, parent: side_mirror }
  - { id: 90, name: left_window,        group: cockpit, eval: false }
  - { id: 91, name: right_window,       group: cockpit, eval: false }
  - { id: 92, name: a_pillar_left,      group: cockpit, eval: false, parent: a_pillar }
  - { id: 93, name: a_pillar_right,     group: cockpit, eval: false, parent: a_pillar }
  - { id: 94, name: sun_visor,          group: cockpit, eval: false, parent: other_cockpit }
  - { id: 95, name: door_panel,         group: cockpit, eval: false, parent: other_cockpit }
  - { id: 96, name: driver_arm,         group: cockpit, eval: false, parent: driver_hand }
  - { id: 97, name: phone_mount,        group: cockpit, eval: false, parent: other_cockpit }
  - { id: 98, name: passenger,          group: cockpit, eval: false }
  - { id: 99, name: headrest,           group: cockpit, eval: false, parent: other_cockpit }
