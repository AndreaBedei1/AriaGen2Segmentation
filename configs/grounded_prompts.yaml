    priority: 72
    min_area: 100
    group_tag: furniture
  pole:
    prompt: "pole. street pole. sign pole. utility pole."
    synonyms: ["lamp post"]
    box_threshold: 0.25
    priority: 30
    min_area: 120
    group_tag: furniture
  guardrail:
    prompt: "guardrail. metal crash barrier along road."
    synonyms: ["armco barrier"]
    priority: 24
    min_area: 400
    group_tag: barriers
  barrier:
    prompt: "road barrier. traffic barrier. jersey barrier."
    synonyms: ["concrete barrier"]
    priority: 26
    min_area: 400
    group_tag: barriers
  wall:
    prompt: "wall. retaining wall."
    synonyms: ["stone wall"]
    priority: 15
    min_area: 800
    group_tag: barriers
  fence:
    prompt: "fence. metal fence. wooden fence."
    synonyms: ["railing"]
    priority: 16
    min_area: 400
    group_tag: barriers
  building:
    prompt: "building. house. facade."
    synonyms: ["apartment block", "shop building"]
    priority: 7
    min_area: 3000
    morph_close: 5
    group_tag: background
  vegetation:
    prompt: "vegetation. tree. bush. hedge."
    synonyms: ["foliage", "greenery"]
    priority: 8
    min_area: 1500
    morph_close: 5
    group_tag: background
  terrain:
    prompt: "grass. terrain. soil. field."
    synonyms: ["lawn", "dirt ground"]
    priority: 11
    min_area: 2000
    morph_close: 5
    group_tag: background
  sky:
