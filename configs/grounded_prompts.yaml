# Grounding DINO prompts per canonical class (§7). Schema v2 (Phase 1).
# Per class:
#   prompt              main text phrase
#   prompt_variants     extra phrasings REALLY sent to GDINO (deduped) — improve recall
#   synonyms            further phrasings sent + used for phrase->class mapping
#   negative_contexts   decoy phrases; a detection matching one is dropped
#   prompt_mode         combined (shared group caption) | variants (per-class call) | individual
#   box_threshold       FINAL per-class GDINO box-score floor (re-applied after mapping)
#   text_threshold / candidate_box_threshold / candidate_text_threshold / min_map_confidence
#   priority            overlap priority (HIGHER wins a pixel conflict)
#   min_area / max_area_frac  a class mask larger than this fraction of the frame is dropped
#                       (kills the "absent class -> GDINO returns a full-frame box -> SAM
#                        fills 90% of the frame" false positive)
#   min_box_width / min_box_height / min_aspect_ratio / max_aspect_ratio / edge_margin
#   allowed_regions / forbidden_regions   list of [x0,y0,x1,y1] in [0,1] frame fractions
#   max_instances / nms_iou / morph_close / group_tag / solo
#
# prompt_mode defaults to `variants` (per-class calls): a big combined caption makes GDINO
# return "run-on" phrases spanning several class prompts, which are then ambiguous. Per-class
# calls keep phrases clean at the cost of more calls — Method 1 prioritises recall (§7).

defaults:
  box_threshold: 0.28
  text_threshold: 0.25
  candidate_box_threshold: 0.14
  candidate_text_threshold: 0.10
  min_map_confidence: 0.28
  min_area: 400
  max_area_frac: 0.55          # global cap; backgrounds override higher, small objects lower
  morph_close: 3
  max_instances: null
  prompt_mode: variants
  solo: false

prompt_strategy: grouped

# Hierarchical parent->subclass classification (Phase 3 fix). When
# grounded_sam2.hierarchical_subclasses is true, the subclasses listed here are NOT
# prompted on the full frame; instead the parent is detected first and the subclass
# prompts run on the parent crop, relabelling the mask only on a confident, clear win.
hierarchy:
  subclass_min_score: 0.35
  subclass_min_margin: 0.08
  max_parents_per_frame: 12
  min_parent_area_frac: 0.002
  parents:
    person: [pedestrian, child, cyclist, motorcyclist, scooter_rider, wheelchair_user, person_with_stroller]
    rider: [cyclist, motorcyclist, scooter_rider]
    car: [van, pickup, emergency_vehicle]
    truck: [construction_vehicle, trailer]

